[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibekernel"
version = "0.1.0"
description = "Persistent, library, and grouped GPU execution microbenchmarks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.4",
  "triton>=3.0; platform_system == 'Linux'",
]

[tool.setuptools.packages.find]
include = ["vibekernel*"]
